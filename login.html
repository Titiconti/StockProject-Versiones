<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockProject</title>
<style>
:root{--bg:#F4F6FA;--card:#fff;--tx:#14213A;--mu:#5F6B7E;--bd:#E2E7F0;--ac:#2447F9;--bad:#D92D20;--ok:#0E9F6E}
@media(prefers-color-scheme:dark){:root{--bg:#0C1626;--card:#14223A;--tx:#E8EDF7;--mu:#9AA8BF;--bd:#24344F;--ac:#6E8BFF}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:16px system-ui,Segoe UI,sans-serif}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:26px;width:min(380px,92vw)}
h1{margin:0 0 4px;font-size:22px;color:var(--ac)}p{margin:0 0 14px;color:var(--mu);font-size:14px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input{width:100%;padding:11px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.l{background:none;color:var(--ac);font-weight:600;margin-top:8px;padding:6px}
#m{min-height:20px;font-size:14px;margin-top:10px;text-align:center;color:var(--bad)}#m.ok{color:var(--ok)}.hide{display:none}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:radial-gradient(70% 60% at 50% 0,#1D3B6E 0,#12233D 60%) fixed #12233D}.c{border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.55);animation:in .35s cubic-bezier(.2,.8,.2,1)}h1{display:flex;align-items:center;gap:12px;color:var(--tx);font-weight:400;letter-spacing:-.02em}h1 b{font-weight:700}input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style></head><body>
<div class="c">
<h1><svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#12233D"/><path d="M32 13 49 22.75 32 32.5 15 22.75Z" fill="#0E9F6E"/><path d="M15 22.75 32 32.5V52L15 42.25Z" fill="#2447F9"/><path d="M49 22.75 32 32.5V52L49 42.25Z" fill="#6E8BFF"/><path d="M23.5 17.9 40.5 27.6V36.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/></svg><span><b>Stock</b>Project</span></h1>
<form id="f"><p>Ingresá con tu usuario</p>
<label for="u">Usuario</label><input id="u" autocomplete="username" autofocus>
<label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password">
<button>Entrar</button><button type="button" class="l" id="olv">Olvidé mi contraseña</button></form>
<form id="r" class="hide"><p>Recuperar contraseña con tu pregunta de seguridad</p>
<label for="ru">Usuario</label><input id="ru" autocomplete="username">
<div id="rq" class="hide"><p id="rqt" style="margin:10px 0 0;color:var(--tx);font-weight:600"></p>
<label for="ra">Respuesta</label><input id="ra" autocomplete="off">
<label for="rn">Nueva contraseña (8 o más, con letras y números)</label><input id="rn" type="password" autocomplete="new-password"></div>
<button id="rb">Continuar</button><button type="button" class="l" id="vol">Volver</button></form>
<div id="m"></div></div>
<script>
const $=s=>document.querySelector(s),msg=(t,ok)=>{$('#m').textContent=t||'';$('#m').className=ok?'ok':''};
$('#f').onsubmit=async e=>{e.preventDefault();msg();const r=await sp.auth.login($('#u').value,$('#p').value);if(!r.ok){msg(r.err);$('#p').select()}};
$('#olv').onclick=()=>{msg();$('#f').classList.add('hide');$('#r').classList.remove('hide');$('#ru').value=$('#u').value;$('#ru').focus()};
$('#vol').onclick=()=>{msg();$('#r').classList.add('hide');$('#f').classList.remove('hide');$('#rq').classList.add('hide');$('#rb').textContent='Continuar'};
$('#r').onsubmit=async e=>{e.preventDefault();msg();
  if($('#rq').classList.contains('hide')){const q=await sp.auth.call('preguntaDe',$('#ru').value);
    if(!q)return msg('Ese usuario no configuró una pregunta de seguridad. Pedile a un administrador que restablezca tu contraseña.');
    $('#rqt').textContent=q;$('#rq').classList.remove('hide');$('#rb').textContent='Cambiar contraseña';$('#ra').focus();return}
  const r=await sp.auth.call('recuperar',$('#ru').value,$('#ra').value,$('#rn').value);
  if(!r.ok)return msg(r.err);
  msg('Contraseña cambiada. Ya podés ingresar.',true);$('#u').value=$('#ru').value;$('#p').value='';$('#vol').click();msg('Contraseña cambiada. Ya podés ingresar.',true);$('#p').focus()};
</script></body></html>
