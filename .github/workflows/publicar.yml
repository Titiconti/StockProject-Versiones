# Publica una versión cuando se crea una etiqueta vX.Y.Z (solo con aprobación del dueño: actualiza a todos los clientes).
# Orden: pruebas (si fallan, no se publica) -> instalador -> verificación de los archivos -> subida a la Release.
# El programa instalado busca ahí latest.yml y el instalador, y comprueba el sha512 antes de instalar.
# La etiqueta tiene que coincidir con "version" de package.json: v5.0.0 <-> "version": "5.0.0"
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: pruebas
    runs-on: windows-latest
    permissions:
      contents: write   # solo este trabajo puede escribir en Releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm ci

      # El nombre de la etiqueta entra por una variable de entorno, nunca pegado dentro del script (no se puede inyectar un comando).
      - name: Comprobar que la versión coincide con la etiqueta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$TAG" ]; then echo "package.json dice $V pero la etiqueta es $TAG"; exit 1; fi

      - name: Construir el instalador (sin publicar)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verificar los archivos antes de publicar
        run: node verificar-dist.js

      - name: Subir a la Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "StockProject ${TAG#v}" --notes "Ver NOVEDADES.md"
          gh release upload "$TAG" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
